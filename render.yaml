# EMBER — Render blueprint. CONTEXT.md §8.
#
# "Deploy a skeleton to Render in HOUR 1, push all day."
#
# ONE service. Express serves the built frontend at `/` and the API at `/api/*`,
# so the app is same-origin: no CORS to configure, no VITE_API_URL pointing at
# another host, no second free-tier service to keep awake. One URL to demo.
#
# Setup:
#   1. Push this repo to GitHub.
#   2. Render dashboard → New → Blueprint → point at the repo.
#   3. Set the secrets in the service's Environment tab (they are marked
#      sync:false below, so Render prompts for them and never stores them here).
#
# ⚠️  EVERY SECRET IS OPTIONAL. Deploy with none of them set and the app still
#     works end to end on canned demo data. Add keys as they arrive.

services:
  - type: web
    name: ember
    runtime: node
    plan: free
    region: oregon
    # Build from the repo root so the workspace and shared/ come along.
    # `npm run build` builds BOTH workspaces — the API cannot serve a frontend
    # that was never built.
    buildCommand: npm ci && npm run build
    startCommand: node backend/dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.11.0

      # ── Frontend, baked in at BUILD time ────────────────────────────────
      # Vite inlines VITE_* vars into the bundle, so these must be present when
      # the build runs, not when the server starts.
      #
      # Public Mapbox token (pk.*). Without it the app renders the token-free
      # schematic map instead — degraded, but never broken.
      - key: VITE_MAPBOX_TOKEN
        sync: false
      # Deliberately NOT set: leaving VITE_API_URL empty makes the client call
      # /api on its own origin, which is exactly what we now serve.

      # ── Backend secrets — set in the dashboard, never in this file ───────
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: NASA_FIRMS_API_KEY
        sync: false
      - key: MIREYE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Same-origin now, so this can stay empty. Only needed if something else
      # (a separate static host, a native client) calls this API cross-origin.
      - key: CORS_ORIGINS
        sync: false

      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: EMBER_DEFAULT_SCENARIO
        value: palisades-2025
      # Flip to true from the dashboard for a guaranteed-offline demo.
      - key: EMBER_FORCE_OFFLINE
        value: false
